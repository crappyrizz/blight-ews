name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      # Postgres 16+ is required: the weather uniqueness constraint uses
      # NULLS NOT DISTINCT, which arrived in Postgres 15.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blight
          POSTGRES_PASSWORD: blight
          POSTGRES_DB: blight_ews
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://blight:blight@localhost:5432/blight_ews
      TEST_DATABASE_URL: postgresql+psycopg://blight:blight@localhost:5432/blight_ews_test
      JWT_SECRET: ci-only-not-a-real-secret
      JWT_EXPIRE_MINUTES: "60"
      AT_USERNAME: sandbox
      AT_API_KEY: ci-only
      AT_SENDER_ID: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create the test database
        run: psql "postgresql://blight:blight@localhost:5432/blight_ews" -c "CREATE DATABASE blight_ews_test OWNER blight;"
        env:
          PGPASSWORD: blight

      - name: Check migrations build the schema
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q
