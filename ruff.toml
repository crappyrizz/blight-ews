# Ruff linter settings. Run with:  .\dev.ps1 lint   (or: ruff check .)
target-version = "py311"
line-length = 100
extend-exclude = ["data", "models", "app", "firmware"]

[lint]
select = [
    "E4", "E7", "E9",  # pycodestyle: real errors only (no line-length nagging)
    "F",               # pyflakes: unused imports/variables, undefined names
    "I",               # import order
    "UP",              # pyupgrade: modern syntax for Python 3.11
    "B",               # bugbear: likely bugs
]
ignore = [
    "B008",  # FastAPI's Depends(...) in argument defaults is the intended pattern
]
